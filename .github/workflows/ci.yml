name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh tests/test.sh
      - name: Syntax
        run: bash -n install.sh
      - name: Tests
        run: bash tests/test.sh

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # /bin/bash is bash 3.2, the version every Mac ships with
      - name: Syntax (bash 3.2)
        run: /bin/bash -n install.sh
      - name: Syntax (zsh launcher)
        run: sed -n '/^# >>> claude-gh-accounts >>>$/,/^# <<< claude-gh-accounts <<<$/p' install.sh | zsh -n
      - name: Tests (bash 3.2)
        run: /bin/bash tests/test.sh

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $r = @("install.ps1", "tests/test.ps1") | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\test.ps1
      - name: Tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/test.ps1
