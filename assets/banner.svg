<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">claude-gh-accounts</title>
  <desc id="d">One computer. Many GitHub accounts. Zero mix-ups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f2e"/>
      <stop offset="0.55" stop-color="#231a4f"/>
      <stop offset="1" stop-color="#0f2a3d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="0.5" stop-color="#b892ff"/>
      <stop offset="1" stop-color="#5ee7ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glow2)"/>

  <!-- prompt chip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">
    <rect x="455" y="46" width="290" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="600" y="72" text-anchor="middle" fill="#c9c3ff"><tspan fill="#5ee7ff">~/code/work</tspan> $ claude</text>
  </g>

  <!-- title -->
  <text x="600" y="168" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="74" font-weight="800" letter-spacing="-1" fill="url(#title)">claude-gh-accounts</text>

  <!-- tagline -->
  <text x="600" y="218" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#ece9ff">One computer. Many GitHub accounts. Zero mix-ups.</text>

  <!-- folder -> account chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">
    <rect x="232" y="252" width="350" height="44" rx="12" fill="#ff7ad9" fill-opacity="0.12" stroke="#ff7ad9" stroke-opacity="0.55"/>
    <text x="407" y="280" text-anchor="middle" fill="#ffd3f3">~/code/work  <tspan fill="#ff7ad9">&#x279C;</tspan>  work account</text>
    <rect x="618" y="252" width="350" height="44" rx="12" fill="#5ee7ff" fill-opacity="0.10" stroke="#5ee7ff" stroke-opacity="0.55"/>
    <text x="793" y="280" text-anchor="middle" fill="#cff8ff">~/code/personal  <tspan fill="#5ee7ff">&#x279C;</tspan>  personal</text>
  </g>
</svg>
