    <text x="56" y="210" font-weight="700">One&#160;computer.&#160;Many&#160;GitHub&#160;accounts.&#160;Zero&#160;mix-ups.</text>

    <text x="44" y="246"><tspan fill="#d38bff">■■■■</tspan><tspan fill="#5d5a80">□□</tspan>&#160;&#160;<tspan fill="#8a87ad">STEP&#160;4&#160;OF&#160;6</tspan></text>
    <text x="44" y="268" font-weight="700">Your&#160;GitHub&#160;accounts</text>
    <text x="44" y="290" fill="#8a87ad">Each&#160;account&#160;gets&#160;its&#160;own&#160;folder.&#160;That's&#160;the&#160;whole&#160;trick.</text>

    <text x="44" y="330"><tspan fill="#ff7ad9" font-weight="700">?</tspan>&#160;<tspan font-weight="700">What's&#160;the&#160;GitHub&#160;username&#160;for&#160;'work'?</tspan></text>
    <text x="64" y="352" fill="#8a87ad">The&#160;name&#160;you&#160;log&#160;in&#160;with,&#160;shown&#160;at&#160;github.com/&lt;username&gt;</text>
    <text x="64" y="374"><tspan fill="#5ee7ff">›</tspan>&#160;jane-at-acme</text>

    <text x="44" y="414" fill="#8fb4ff">╭─&#160;<tspan fill="#e6e4f5" font-weight="700">Quick&#160;check</tspan>&#160;─────────────────────────────</text>
    <text x="44" y="436"><tspan fill="#8fb4ff">│</tspan>&#160;&#160;<tspan fill="#8a87ad">Nickname</tspan>&#160;&#160;<tspan font-weight="700">work</tspan></text>
    <text x="44" y="458"><tspan fill="#8fb4ff">│</tspan>&#160;&#160;<tspan fill="#8a87ad">GitHub&#160;&#160;</tspan>&#160;&#160;<tspan font-weight="700">jane-at-acme</tspan></text>
    <text x="44" y="480"><tspan fill="#8fb4ff">│</tspan>&#160;&#160;<tspan fill="#8a87ad">Folder&#160;&#160;</tspan>&#160;&#160;<tspan font-weight="700">~/code/work</tspan></text>
    <text x="44" y="502"><tspan fill="#8fb4ff">│</tspan>&#160;&#160;<tspan fill="#8a87ad">Commits&#160;</tspan>&#160;&#160;<tspan font-weight="700">Jane&#160;Doe</tspan>&#160;<tspan fill="#8a87ad">&lt;jane@acme.com&gt;</tspan></text>
    <text x="44" y="524" fill="#8fb4ff">╰───────────────────────────────────────────</text>

    <text x="44" y="564"><tspan fill="#ff7ad9" font-weight="700">?</tspan>&#160;<tspan font-weight="700">Does&#160;this&#160;look&#160;right?</tspan>&#160;<tspan fill="#8a87ad">(Y/n)</tspan>&#160;<tspan fill="#5ee7ff">›</tspan>&#160;y</text>
    <text x="44" y="600"><tspan fill="#5ef2a0">✔</tspan>&#160;Logged&#160;in&#160;as&#160;<tspan font-weight="700">jane-at-acme</tspan></text>
    <text x="44" y="622"><tspan fill="#5ef2a0">✔</tspan>&#160;Repos&#160;in&#160;~/code/work&#160;will&#160;now&#160;use&#160;<tspan font-weight="700">jane-at-acme</tspan></text>
    <text x="44" y="654"><tspan fill="#ff6b8b">♥</tspan>&#160;&#160;<tspan font-weight="700">Enjoying&#160;it?&#160;A&#160;star&#160;on&#160;GitHub&#160;helps&#160;other&#160;people&#160;find&#160;it.</tspan></text>
